[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verida-backend"
version = "0.1.0"
description = "HTTP API для мобильного клиента Verida (scientific_chat_app)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.54.0",
    "python-dotenv>=1.0.1",
    "alembic==1.14.0",
    "asyncpg==0.30.0",
    "bcrypt==4.2.1",
    "email-validator==2.2.0",
    "fastapi==0.115.5",
    "pydantic-settings==2.6.1",
    "psycopg[binary]==3.2.3",
    "PyJWT==2.9.0",
    "sqlalchemy[asyncio]==2.0.36",
    "uvicorn[standard]==0.32.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "aiosqlite==0.20.0",
    "httpx==0.27.2",
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
