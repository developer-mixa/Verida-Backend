services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: verida
      POSTGRES_PASSWORD: verida
      POSTGRES_DB: verida
    volumes:
      - verida_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verida -d verida"]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql+asyncpg://verida:verida@db:5432/verida
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  verida_pgdata:
