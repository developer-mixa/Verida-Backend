# Только PostgreSQL с портом на хосте — для локального FastAPI с --reload.
# Учётные данные из `.env` (те же POSTGRES_*, что для основного compose), с откатом к verida/verida.
# Запуск: docker compose -f docker-compose.local-db.yml up -d

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-verida}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-verida}
      POSTGRES_DB: ${POSTGRES_DB:-verida}
    ports:
      - "${LOCAL_DB_PORT:-5432}:5432"
    volumes:
      - verida_pgdata_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-verida} -d ${POSTGRES_DB:-verida}"]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  verida_pgdata_local:
